<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>demo</title>
  </head>
  <style></style>

  <body>
    <div class="container"></div>

    <script>
      const promise = new Promise((resolve, reject) => {
        resolve("pikachu");
      });
      promise
        .then((res) => {
          console.log(res); // pikachu
        })
        .then((res) => {
          console.log(res); // undefined
          return "被决议了。";
        })
        .then((res) => {
          console.log(res); // 被决议了
        });
    </script>
  </body>
</html>
