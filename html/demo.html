<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>demo</title>
  </head>
  <style>
    .first,
    .second {
      width: 200px;
      height: 200px;
      background-color: lightgreen;
    }
    .second {
      position: relative;
      background-color: lightcoral;
    }
  </style>

  <body>
    <div class="container">
      <div class="first"></div>
      <div class="second"></div>
    </div>

    <script>
      class Person {
        constructor(name, age, hobbies) {
          this.name = name
          this.age = age
          this.hobbies = hobbies
        }

        // 注意这里前面要加 *，否则就不是一个生成器函数
        *[Symbol.iterator]() {
          yield* this.hobbies;
        }
      }

      let person = new Person('lucy', 28, ['coffee', 'puzzles', 'music'])
      for (let p of person) {
        console.log(p);
      }
    </script>
  </body>
</html>
