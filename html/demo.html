<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>demo</title>
  </head>
  <style>
    .first,
    .second {
      width: 200px;
      height: 200px;
      background-color: lightgreen;
    }
    .second {
      position: relative;
      background-color: lightcoral;
    }
  </style>

  <body>
    <div class="container">
      <div class="first"></div>
      <div class="second"></div>
    </div>

    <script>
      function* foo() {
        console.log("start");
        yield "yeild";
        console.log("end");
      }

      const generator = foo();
      console.log(generator.next());
      console.log(generator.next());
    </script>
  </body>
</html>
