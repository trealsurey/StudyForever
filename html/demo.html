<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>测试JS代码执行顺序</title>
  </head>
  <style>
    .container {
      border: 3px solid lightblue;
    }
    .div1 {
      width: 100px;
      height: 100px;
      background-color: lightgreen;
      float: left;
    }
    .div2 {
      width: 150px;
      height: 150px;
      background-color: lightcoral;
      float: left;
    }
    .clear {
      clear: both;
    }
    .footer {
      height: 50px;
      background-color: grey;
    }
  </style>

  <body>
    <div class="container">
      <div class="div1">div1</div>
      <div class="div2">div2</div>
      <!-- 清除浮动 -->
      <div class="clear"></div>
    </div>
    <div class="footer">footer</div>
  </body>
</html>
