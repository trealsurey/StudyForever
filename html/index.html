<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      perspective: 500px;
    }
    img {
      display: block;
      width: 400px;
      height: 400px;
      margin: 200px auto;
      transition: all 1s;
    }
    img:hover {
      transform: rotate3d(1, 1, 0, 145deg);
    }
  </style>

  <body>
    <button>button</button>
  </body>

  <script>
    let that;
    class Star {
      constructor(uname, age) {
        that = this;
        this.uname = uname;
        this.age = age;
        // btn按钮调用sing方法
        this.btn = document.querySelector("button");
        this.btn.onclick = this.sing;
        // constructor 里面的this 指向的是 创建的实例对象
        console.log("constructor: ", this);
      }
      sing() {
        // 这个sing方法里面的 this 指向的是 btn 这个按钮，因为这个按钮调用了这个函数
        console.log("sing:", this); // button
        console.log(that.uname); // that里面存储的是 constructor 里面的 this
      }
      dance() {
        // 这个dance里面的 this 指向的是实例对象 wbk 因为 wbk 调用了这个函数
        console.log("dance:", this);
      }
    }
    let wbk = new Star("wbk", 28);
    wbk.dance();
    wbk.sing()

    // class Star {

    //   sing() {

    //     console.log("唱歌的是：" + uname);
    //   }
    // }

    // let star = new Star('wbk', 128)
    // star.sing()
  </script>
</html>
