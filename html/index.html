<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
    <script src="../js/jquery-3.6.1.min.js"></script>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .box {
      text-align: center;
    }

    .box a {
      display: inline-block;
      width: 36px;
      height: 36px;
      background-color: #f7f7f7;
      border: 1px solid #ccc;
      text-align: center;
      line-height: 36px;
      text-decoration: none;
      color: #333;
    }

    /* 注意这里必须要加 .box 否则权重不够 */
    .box .prev,
    .box .next {
      width: 100px;
      font-size: 13px;
    }
  </style>

  <body>
    <div class="box">
      <a href="#" class="prev">&lt;&lt; 上一页</a>
      <a href="#">1</a>
      <a href="#">2</a>
      <a href="#">3</a>
      <a href="#" class="next">下一页 &gt;&gt;</a>
    </div>
  </body>

  <script>
    let RegExp = 1;
    console.log(window.RegExp);
  </script>
</html>
