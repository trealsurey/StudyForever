<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学成在线首页</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <style>
    .no {
      height: 30px;
      width: 30px;
      background-color: lightblue;
      float: left;
    }
    .main {
      height: 300px;
      width: 300px;
      background-color: lightcoral;
      float: left;
    }
  </style>

  <body>
    <div class="main">
      <input type="text" class="inp" value="请输入搜索内容..."/>
    </div>
  </body>

  <script>
    var inp = document.querySelector('.inp')
    inp.onfocus = () => {
      inp.value = ''
    }
    inp.onblur = () => {
      inp.value = '请输入搜索内容...'
    }
  </script>
</html>
