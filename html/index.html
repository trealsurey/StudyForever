<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      perspective: 500px;
    }
    img {
      display: block;
      width: 400px;
      height: 400px;
      margin: 200px auto;
      transition: all 1s;
    }
    img:hover {
      transform: rotate3d(1, 1, 0, 145deg);
    }
  </style>

  <body>
    <div class="box"></div>
  </body>

  <script>
    const oBox = document.querySelector(".box");
    let id = 1,
      name = "jojo";
    let htmlStr = 
    `<ul>
      <li>
          <p id=${id}>${name}</p>
      </li>
    </ul>`;
    oBox.innerHTML = htmlStr;
  </script>
</html>
