<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      perspective: 500px;
    }
    img {
      display: block;
      width: 400px;
      height: 400px;
      margin: 200px auto;
      transition: all 1s;
    }
    img:hover {
      transform: rotate3d(1, 1, 0, 145deg);
    }
  </style>

  <body>
    <button>button</button>
  </body>

  <script>
    function Human(uname, age) {
      this.uname = uname;
      this.age = age;
    }
    // 父构造成员方法
    Human.prototype.eat = function () {
      console.log("eat something");
    };
    // 子构造函数
    function Student(uname, age, major) {
      Human.call(this, uname, age);
      this.major = major;
    }
    // 创建实例对象，将子类原型对象指向实例对象
    Student.prototype = new Human();
    // 将子类的 constructor 重新指向子类的构造函数
    Student.prototype.constructor = Student;
    // 子构造函数特有成员方法
    Student.prototype.exam = function () {
      console.log("I have exams");
    };
    let jack = new Student("Jack", 20, "Math");
    jack.eat();
    jack.exam();
    console.log(Human.prototype);
  </script>
</html>
