<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
    <script src="../js/jquery-3.6.1.min.js"></script>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .bar {
      height: 20px;
      width: 200px;
      border: 1px solid red;
      border-radius: 15px;
      margin: 0 auto;
      margin-top: 100px;
    }
    .in {
      height: 100%;
      width: 50%;
      background-color: red;
      border-radius: 15px;
      transition: all 0.5s ease;
    }
    .bar:hover .in {
      width: 100%;
    }
  </style>

  <body>
    <div class="bar">
      <div class="in"></div>
    </div>
  </body>

  <script>

  </script>
</html>
