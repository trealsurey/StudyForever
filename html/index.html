<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demo</title>
    <script src="../js/jquery-3.6.1.min.js"></script>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
    }
    ul {
      margin-left: 200px;
    }
  </style>

  <body>
    <ul class="list">
      <li>1</li>
      <li>2</li>
      <li>3</li>
      <li>4</li>
    </ul>
  </body>

  <script>
    $(function() {
      $('li').click(function() {
        $(this).css('color', 'coral')
        $(this).siblings('li').css('color', 'black')
      })
    })
  </script>
</html>
