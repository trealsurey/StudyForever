<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Throttle</title>
  </head>
  <body>
    <div>
      <input type="text" />
      <button>取消</button>
    </div>

    <!-- 
      了解即可，需要先了解尾部执行
    -->
    <script>
      // trailing 控制
      const myThrottle = function (fn, interval, trailing = false) {
        let startTime = 0;
        let timer = null;

        const _throttle = function () {
          const nowTime = new Date().getTime();
          const waitTime = interval - (nowTime - startTime);
          if (waitTime <= 0) {
            if (timer) clearTimeout(timer);
            fn.apply(this);
            startTime = nowTime;
            timer = null;
            return;
          }

          if (trailing && !timer) {
            timer = setTimeout(() => {
              fn.apply(this);
              // 注意这里要赋最新的时间，而不是原来的 nowTime
              startTime = new Date().getTime();
              timer = null;
            }, waitTime);
          }
        };

        _throttle.cancel = function() {
          if (timer)  clearTimeout(timer)
          startTime = 0
          timer = null
        }

        return _throttle;
      };
    </script>

    <script>
      const inputEl = document.querySelector("input");
      const btnEl = document.querySelector('button')
      const throttleFn = myThrottle(
        function () {
          console.log("发送请求：" + this.value);
        },
        2000,
        true
      );
      inputEl.oninput = throttleFn
      btnEl.onclick = function () {
        throttleFn.cancel()
      }
    </script>
  </body>
</html>
