<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Debounce</title>
  </head>
  <body>
    <div>
      <input type="text" />
    </div>

    <script>
      function myDebounce(fn, delay) {
        // 1. 记录上一次事件触发的 timer
        let timer = null;

        // 2. 触发事件时执行的函数
        // 这里不要写成箭头函数，否则下面的 this 会指向 window
        // 那么在调用的时候就不能拿到输入框中的内容了
        const _debounce = function () {
          // 2.1 如果在时间间隔内再次触发，那么就取消上一次的事件 
          if (timer) clearTimeout(timer);

          // 2.2 延迟执行对应的回调函数 fn()
          timer = setTimeout(() => {
            // 注意这里要加上 apply()
            // 而且因为这里是箭头函数，this 会指向上一层的 this
            fn.apply(this);
            // 2.3 函数执行完成之后，将 timer 置空
            timer = null;
          }, delay);
        };

        // 3. 返回一个新函数
        return _debounce;
      }
    </script>

    <script>
      const inputEl = document.querySelector("input");
      inputEl.oninput = myDebounce(function() {
        console.log('发送请求：' + this.value);
      }, 1500);
    </script>
  </body>
</html>
