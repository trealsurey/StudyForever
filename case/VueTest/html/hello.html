<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../js/vue.js"></script>
  </head>

  <style></style>

  <body>
    <div id="app">
      <cpn :csingers="singers"></cpn>
    </div>
    <template id="cpn">
      <div>
        <h3>{{title}}</h3>
        <ul>
          <li v-for="singer in csingers">{{singer}}</li>
        </ul>
      </div>
    </template>

    <script>
      // 子组件
      const cpn = {
        data() {
          return {
            title: '父子组件通信'
          }
        },
        template: '#cpn',
        // 父 -> 子：子组件拿到父组件的数据
        props: ['csingers']
      }
      // root 组件
      const vm = new Vue({
        el: "#app",
        data: {
          singers: ['陶喆', '周杰伦', '蔡依林']
        },
        // 局部组件
        components: {
          cpn
        },
      });
    </script>
  </body>
</html>
