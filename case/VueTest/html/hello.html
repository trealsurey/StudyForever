<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../js/vue.js"></script>
  </head>

  <style></style>

  <body>
    <!-- 父组件模板 -->
    <div id="app">
      <!-- 在这里接收子组件传递过来的事件，并用 v-on 绑定给父组件 -->
      <!-- 现在这里不要写驼峰，以后使用脚手架时就可以用驼峰了 -->
      <cpn @item-click="btnClick"></cpn>
    </div>
    <!-- 子组件模板 -->
    <template id="cpn">
      <div>
        <button v-for="item in catagories" @click="itemClick(item)">
          {{item.name}}
        </button>
      </div>
    </template>

    <script>
      // 子组件
      const cpn = {
        template: "#cpn",
        data() {
          return {
            catagories: [
              { id: 1, name: "手机数码" },
              { id: 2, name: "潮流家电" },
              { id: 3, name: "电脑办公" },
            ],
          };
        },
        methods: {
          itemClick(item) {
            // 子 -> 父，子组件向父组件传递一个名为 item-click 的事件
            this.$emit("item-click", item);
          },
        },
      };

      // root 组件
      const vm = new Vue({
        el: "#app",
        data: {},
        // 局部组件
        components: { cpn },
        methods: {
          btnClick(item) {
            console.log("收到子组件信息", item);
          },
        },
      });
    </script>
  </body>
</html>
