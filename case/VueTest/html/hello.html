<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../js/vue.js"></script>
  </head>

  <style>
    .active {
      color: coral;
    }
  </style>

  <body>
    <div id="app">
      <button @click="btn1Click">按钮1</button>
      <button @click="btn2Click('jojo')">按钮2</button>
      <button @click="btn2Click()">按钮3</button>
      <button @click="btn2Click">按钮4</button>
      <button @click="btn3Click">按钮5</button>
      <button @click="btn3Click('jojo', $event)">按钮6</button>
      <button @click="btn3Click">按钮7</button>
      <br/>
      <input type="text" @keyup.13="keyupClick" />
    </div>

    <script>
      const vm = new Vue({
        el: "#app",
        data: {},
        methods: {
          btn1Click() {
            console.log("btn1Click");
          },
          btn2Click(name) {
            console.log(name);
          },
          btn3Click(name, event) {
            console.log(name, event);
          },
          keyupClick() {
            console.log("keyup");
          }
        },
      });
    </script>
  </body>
</html>
