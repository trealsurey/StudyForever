<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../js/vue.js"></script>
  </head>
  <body>
    <div id="app">
      <cpn ref="btn"></cpn>
      <button @click="btnClick">按钮</button>
    </div>
    <template id="cpn">
      <div><p>我是子组件</p></div>
    </template>

    <script>
      const cpn = {
        template: '#cpn',
        data() {
          return {
            name: '子组件名字'
          }
        },
      }

      const vm = new Vue({
        el: '#app',
        methods: {
          btnClick() {
            console.log(this.$refs.btn.name);
          }
        },
        components: {cpn},
      });
    </script>
  </body>
</html>
