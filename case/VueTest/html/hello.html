<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../js/vue.js"></script>
  </head>

  <style></style>

  <body>
    <div id="app">
      <cpn2>
        
      </cpn2>
      <cpn1></cpn1>
    </div>

    <script>
      const cpn1 = Vue.extend({
        template: `
          <div>
            <h2>我是标题1111</h2>
            <p>我是内容1111</p>
          </div>`
      })
      const cpn2 = Vue.extend({
        template: `
          <div>
            <h2>我是标题2222</h2>
            <p>我是内容222</p>
          </div>`,
          // 在父组件内部注册子组件，只能在 cpn2 内使用
          components: {
            cpn1: cpn1
          }
      })

      const vm = new Vue({
        el: "#app",
        data: {},
        components: {
          cpn1: cpn1,
          cpn2: cpn2
        }
      });
    </script>
  </body>
</html>
