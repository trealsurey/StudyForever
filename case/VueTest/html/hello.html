<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../js/vue.js"></script>
  </head>

  <style></style>

  <body>
  <div id="app">
    <cpn1></cpn1>
    <cpn2></cpn2>
  </div>
  <script>
    // 1. 全局组件
    Vue.component('cpn1', {
      template: 
        `<div>
          <h2>我是全局</h2>
          <p>我是内容1111</p>
        </div>`
    })
    const vm = new Vue({
      el: "#app",
      data: {},
      // 局部组件
      components: {
        cpn2: {
          template: 
          `<div>
            <h2>我是局部</h2>
            <p>我是内容2222</p>
          </div>`
        }
      }
    });
  </script>
</body>
</html>
