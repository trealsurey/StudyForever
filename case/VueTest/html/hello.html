<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../js/vue.js"></script>
  </head>

  <style>
    .active {
      color: coral;
    }
  </style>

  <body>
    <div id="app">
      {{type}}
      <input type="text" :placeholder="type" @focus="inputFocus" />
      <button @click="changeType">切换类型</button>
    </div>

    <script>
      const vm = new Vue({
        el: "#app",
        data: {
          type: '用户账号',
          isUser: true
        },
        methods: {
          changeType() {
            if (this.isUser) {
              this.type = '用户账号'
            } else  {
              this.type = '用户邮箱'
            }
            this.isUser = !this.isUser
          },
          inputFocus() {
            let input = document.querySelector('input')
            input.setAttribute('placeholder', '')
          }
        }
      });
    </script>
  </body>
</html>
