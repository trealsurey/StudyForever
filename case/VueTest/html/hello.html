<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../js/vue.js"></script>
  </head>
  <style>
    body {
      color: rgb(111, 180, 47)
    }
  </style>
  <body>
    <div id="app">
      <cpn></cpn>
    </div>
    <template id="cpn">
      <div  v-show="isShow">
        <h3>我是子组件</h3>
      </div>
    </template>

    <script>
      const cpn = {
        template: "#cpn",
        data() {
          return {
            isShow: true
          }
        }
      };

      const vm = new Vue({
        el: "#app",
        data: {
          isShow: false
        },
        components: { cpn },
      });
    </script>
  </body>
</html>
