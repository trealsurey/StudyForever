<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demo - 面向对象版 tab 栏切换</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .main {
        height: 100%;
        width: 800px;
        margin: 100px auto;
    }
    h3 {
        text-align: center;
    }
</style>

<body>
    <!-- 
        Ref：Pink 老师 JS 高级教程 P11-P22

        需求：
            1. 点击 tab 栏可以切换效果
            2. 点击 + 号，可以添加 tab 项和内容项
            3. 点击 x 号，可以删除当前的 tab 项和内容项
            4. 双击 tab 项文字或者内容项文字，可以修改里面的文字内容
     -->

    <div class="main">
        <h3>面向对象版 tab 栏切换增删改查</h3>
        <div class="box" id="tab">
            <!-- tab 标签 -->
            <nav class="nav">
                <ul>
                    <li class="li-active">
                        <span>测试1</span>
                    </li>
                    <li>
                        <span>测试2</span>
                    </li>
                    <li>
                        <span>测试3</span>
                    </li>
                </ul>
                <div class="tabadd">
                    <span>+</span>
                </div>
            </nav>

            <!-- tab 内容 -->
            <div class="tab-content">
                <section class="con-active">测试1</section>
                <section>测试2</section>
                <section>测试3</section>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
