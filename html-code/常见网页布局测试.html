<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>常见网页布局测试</title>
    <style>
      * {
        text-align: center;
        margin: 0;
        padding: 0;
      }
      .top {
        margin: 5px 0;
        height: 60px;
        background-color: pink;
      }
      .container {
        width: 870px;
        height: 500px;
        margin: 0 auto;
      }
      .banner {
        height: 150px;
        background-color: lightgreen;
        margin-bottom: 5px;
      }
      .content {
        height: 350px;
      }
      .content-one {
        height: 100px;
      }
      .content-two {
        height: 245px;
      }
      li {
        list-style: none;
        background-color: lightblue;
        /* display: inline-block; */
        /* 这里写了 inline-block之后下面的 float 就会有警告 */
        float: left;
        width: 210px;
        margin-right: 10px;
        margin-bottom: 5px;
      }
      .content-one li {
        height: 100px;
      }
      .content-two li {
        height: 240px;
      }
      .last-one {
        margin-right: 0;
      }
      .last-two {
        margin-right: 0;
      }
      .footer {
        margin: 5px 0;
        height: 140px;
        background-color: pink;
      }
    </style>
  </head>
  <body>
    <div class="top">top</div>
    <div class="container">
      <div class="banner">banner</div>
      <div class="content">
        <div class="content-one">
          <ul class="ul-one">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li class="last-one">4</li>
          </ul>
        </div>
        <div class="content-two">
          <ul class="ul-two">
            <li>a</li>
            <li>b</li>
            <li>c</li>
            <li class="last-two">d</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="footer">footer</div>
  </body>
</html>
